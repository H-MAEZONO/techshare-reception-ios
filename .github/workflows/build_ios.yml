name: Build iOS App (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile Swift & Package IPA
        run: |
          mkdir -p build/Payload
          
          # Swift コンパイル (iOS target)
          xcrun --sdk iphoneos swiftc \
            -parse-as-library \
            -target arm64-apple-ios16.0 \
            -framework SwiftUI \
            -framework CoreNFC \
            -o build/Payload/TechShareReception \
            ios/TechShareReception/TechShareReceptionApp.swift
          
          # Info.plist 配置
          cp ios/TechShareReception/Info.plist build/Payload/Info.plist
          
          # Appバンドル化
          mkdir -p build/TechShareReception.app
          mv build/Payload/TechShareReception build/TechShareReception.app/
          mv build/Payload/Info.plist build/TechShareReception.app/
          
          mkdir -p Payload
          cp -r build/TechShareReception.app Payload/
          zip -r TechShareReception.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TechShareReception-iOS-IPA
          path: TechShareReception.ipa
