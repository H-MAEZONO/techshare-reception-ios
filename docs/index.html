<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TECH SHARE 2026 受付システム</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 12px; }
        .app-container { width: 100%; max-width: 440px; background: #131c31; border-radius: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column; min-height: 94vh; border: 1px solid #1e293b; }
        
        .header { background: linear-gradient(135deg, #004ea2, #e60012); padding: 18px; text-align: center; border-bottom: 1px solid #1e293b; }
        .header h1 { font-size: 1.25rem; font-weight: 900; letter-spacing: 0.5px; }
        .header p { font-size: 0.75rem; opacity: 0.9; margin-top: 2px; }
        
        .room-bar { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 10px 16px; border-bottom: 1px solid #1e293b; }
        .room-bar span { font-size: 0.8rem; font-weight: 700; color: #94a3b8; }
        .room-select { background: #1e293b; color: #38bdf8; border: 1.5px solid #0284c7; padding: 8px 12px; border-radius: 10px; font-weight: 800; font-size: 0.85rem; outline: none; }

        .content { padding: 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; }

        .stats-card { background: #0b0f19; border: 1px solid #1e293b; border-radius: 16px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
        .stats-label { font-size: 0.7rem; color: #64748b; font-weight: 700; text-transform: uppercase; }
        .stats-count { font-size: 1.6rem; font-weight: 900; color: #fff; margin-top: 2px; }
        .stats-badge { background: #0369a1; color: #bae6fd; padding: 4px 10px; border-radius: 8px; font-weight: 700; font-size: 0.75rem; }

        .scan-card { border-radius: 20px; padding: 22px 16px; display: flex; flex-direction: column; gap: 6px; text-align: center; transition: all 0.2s ease; }
        .scan-card.STANDBY { background: #1e293b; border: 2px dashed #475569; color: #94a3b8; }
        .scan-card.ACTIVE { background: #064e3b; border: 2px solid #10b981; color: #a7f3d0; animation: pulse 2s infinite; }
        .scan-card.SCANNED { background: #1e3a8a; border: 2px solid #38bdf8; color: #e0f2fe; }

        .scan-badge { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .scan-title { font-size: 1.4rem; font-weight: 800; margin: 4px 0; }
        .scan-desc { font-size: 0.85rem; opacity: 0.95; line-height: 1.4; word-break: break-all; }

        .btn-scan-toggle { background: #2563eb; color: #fff; border: none; padding: 18px; border-radius: 18px; font-size: 1.15rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4); }
        .btn-scan-toggle.running { background: #10b981; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); }

        .recent-section { margin-top: auto; padding-top: 10px; }
        .recent-header { font-size: 0.8rem; font-weight: 700; color: #64748b; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .recent-list { list-style: none; display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; }
        .recent-item { background: #0b0f19; border: 1px solid #1e293b; padding: 8px 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; }
        .recent-id { font-family: monospace; font-weight: 700; color: #38bdf8; }
        .recent-time { color: #94a3b8; font-size: 0.75rem; }

        .export-box { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid #1e293b; }
        .btn-export { flex: 2; background: #0284c7; color: white; border: none; padding: 14px; border-radius: 14px; font-size: 0.9rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-export:active { transform: scale(0.98); }
        .btn-clear { flex: 1; background: #334155; color: #94a3b8; border: none; padding: 14px; border-radius: 14px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>TECH SHARE 2026</h1>
            <p>BOOST // 出席ログ収集システム</p>
        </div>

        <div class="room-bar">
            <span>📍 受付部屋:</span>
            <select id="selRoom" class="room-select" onchange="saveRoomPreference()">
                <optgroup label="🏢 シマブンビル">
                    <option value="シマブン 13F (総合受付)">シマブン 13F (総合受付)</option>
                    <option value="シマブン 13F (Track 1)">シマブン 13F (Track 1: AI・新技術)</option>
                    <option value="シマブン 11F (Track 2)">シマブン 11F (Track 2: クラウド・データ)</option>
                    <option value="シマブン 11F (Track 3)">シマブン 11F (Track 3: 組織変革・育成)</option>
                    <option value="シマブン 11F (Track 4)">シマブン 11F (Track 4: レガシー・刷新)</option>
                </optgroup>
                <optgroup label="🏢 神鋼ビル (Day 2 WS)">
                    <option value="神鋼ビル 6階 研修室 (WS)">神鋼ビル 6階 研修室 (ワークショップ)</option>
                </optgroup>
            </select>
        </div>

        <div class="content">
            <div class="stats-card">
                <div>
                    <div class="stats-label">この端末の累計スキャン</div>
                    <div class="stats-count" id="lblScanCount">0 件</div>
                </div>
                <div class="stats-badge" id="lblLastSync">ローカル保存中</div>
            </div>

            <div id="scanCard" class="scan-card STANDBY">
                <div class="scan-badge" id="lblBadge">待機中</div>
                <div class="scan-title" id="lblTitle">下のボタンを押してください</div>
                <div class="scan-desc" id="lblDesc">「受付スキャンを開始」を押すと常時かざし受付が有効になります</div>
            </div>

            <button id="btnScanToggle" class="btn-scan-toggle" onclick="toggleScanner()">
                <span style="font-size: 1.4rem;">📱</span>
                <span id="btnScanText">受付スキャンを開始する</span>
            </button>

            <!-- 動作確認用テストボタン -->
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
                <button onclick="recordScan('0102030405060708')" style="background:#1e293b; border:1px solid #334155; color:#94a3b8; padding:8px; border-radius:8px; font-size:0.75rem; cursor:pointer;">テスト1 タッチ</button>
                <button onclick="recordScan('0203040506070809')" style="background:#1e293b; border:1px solid #334155; color:#94a3b8; padding:8px; border-radius:8px; font-size:0.75rem; cursor:pointer;">テスト2 タッチ</button>
            </div>

            <div class="recent-section">
                <div class="recent-header">
                    <span>直近のスキャン履歴 (最新順)</span>
                    <span id="lblRecentCount">0件</span>
                </div>
                <ul class="recent-list" id="recentList">
                    <li style="text-align:center; padding:12px; color:#475569; font-size:0.8rem;">まだスキャン履歴はありません</li>
                </ul>
            </div>

            <div class="export-box">
                <button class="btn-export" onclick="exportData()">
                    <span>📤</span>
                    <span>ログをCSV共有・PCへ送信</span>
                </button>
                <button class="btn-clear" onclick="clearLogs()">消去</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "techshare_2026_reception_logs";
        const ROOM_PREF_KEY = "techshare_room_pref";

        let scanLogs = [];

        // 部屋の復元
        const savedRoom = localStorage.getItem(ROOM_PREF_KEY);
        if (savedRoom) {
            document.getElementById("selRoom").value = savedRoom;
        }

        function saveRoomPreference() {
            const room = document.getElementById("selRoom").value;
            localStorage.setItem(ROOM_PREF_KEY, room);
        }

        // ログの復元
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) scanLogs = JSON.parse(raw);
        } catch(e) {}

        function saveLogs() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(scanLogs)); } catch(e) {}
        }

        function updateUI() {
            document.getElementById("lblScanCount").textContent = `${scanLogs.length} 件`;
            document.getElementById("lblRecentCount").textContent = `${scanLogs.length}件`;

            const list = document.getElementById("recentList");
            list.innerHTML = "";
            if (scanLogs.length === 0) {
                list.innerHTML = `<li style="text-align:center; padding:12px; color:#475569; font-size:0.8rem;">まだスキャン履歴はありません</li>`;
            } else {
                scanLogs.slice().reverse().slice(0, 10).forEach(log => {
                    const li = document.createElement("li");
                    li.className = "recent-item";
                    li.innerHTML = `
                        <div>
                            <span class="recent-id">${log.cardId}</span>
                            <div style="font-size:0.7rem; color:#64748b;">${log.room}</div>
                        </div>
                        <div class="recent-time">${log.time.split(" ")[1]}</div>
                    `;
                    list.appendChild(li);
                });
            }
        }

        function recordScan(rawId) {
            if (!rawId) return;
            const cardId = rawId.trim().toUpperCase();
            const room = document.getElementById("selRoom").value;

            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const dateStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

            // バイブレーション
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

            // ログ蓄積
            const logEntry = {
                timestamp: dateStr,
                time: dateStr,
                room: room,
                cardId: cardId
            };
            scanLogs.push(logEntry);
            saveLogs();

            // 画面表示
            const card = document.getElementById("scanCard");
            card.className = "scan-card SCANNED";
            document.getElementById("lblBadge").textContent = "スキャン完了";
            document.getElementById("lblTitle").textContent = "カードIDを記録しました";
            document.getElementById("lblDesc").textContent = `${dateStr}\n[${room}]\nID: ${cardId}`;

            updateUI();

            // 1.2秒後に待機状態へ自動復帰
            setTimeout(() => {
                if (isScanning) {
                    card.className = "scan-card ACTIVE";
                    document.getElementById("lblBadge").textContent = "常時スキャン待機中";
                    document.getElementById("lblTitle").textContent = "社員証をタッチしてください";
                    document.getElementById("lblDesc").textContent = "スマホの背面にカードをかざしてください";
                }
            }, 1200);
        }

        let isScanning = false;
        let ndef = null;

        async function toggleScanner() {
            const btn = document.getElementById("btnScanToggle");
            const btnText = document.getElementById("btnScanText");
            const card = document.getElementById("scanCard");

            if (!("NDEFReader" in window)) {
                alert("お使いのブラウザは Web NFC に対応していません。Android の Google Chrome で開いてください。");
                const testVal = prompt("【手動入力】カードIDを入力してください:", "0102030405060708");
                if (testVal) recordScan(testVal);
                return;
            }

            try {
                if (!ndef) {
                    ndef = new NDEFReader();
                    await ndef.scan();
                    ndef.onreading = event => {
                        const serial = event.serialNumber;
                        if (serial) {
                            const normalized = serial.replace(/:/g, '').toUpperCase();
                            recordScan(normalized);
                        } else {
                            recordScan("TAG_DETECTED");
                        }
                    };
                    ndef.onreadingerror = () => {
                        alert("読み取りエラー: もう一度カードをしっかりタッチしてください。");
                    };
                }

                isScanning = true;
                btn.className = "btn-scan-toggle running";
                btnText.textContent = "NFC稼働中（タップして停止）";
                card.className = "scan-card ACTIVE";
                document.getElementById("lblBadge").textContent = "常時スキャン待機中";
                document.getElementById("lblTitle").textContent = "社員証をタッチしてください";
                document.getElementById("lblDesc").textContent = "スマホの背面にカードをかざしてください";

            } catch (err) {
                alert("NFCの起動に失敗しました: " + err.message + "\n※Androidの設定でNFCがONになっていることをご確認ください。");
            }
        }

        // CSVエクスポート・共有
        async function exportData() {
            if (scanLogs.length === 0) {
                alert("記録されたスキャンログがありません。");
                return;
            }

            // CSVデータ生成（Excel対応のUTF-8 BOM付き）
            let csvContent = "\uFEFF日時,部屋_トラック,カードID\n";
            scanLogs.forEach(row => {
                csvContent += `"${row.timestamp}","${row.room}","${row.cardId}"\n`;
            });

            const fileName = `techshare_logs_${new Date().toISOString().slice(0,10)}.csv`;
            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });

            // スマホのWeb Share API（メール/Teams/共有）
            if (navigator.canShare && navigator.canShare({ files: [new File([blob], fileName, { type: "text/csv" })] })) {
                try {
                    const file = new File([blob], fileName, { type: "text/csv" });
                    await navigator.share({
                        title: "TECH SHARE 2026 出席受付ログ",
                        text: `TECH SHARE 2026 受付ログ (${scanLogs.length}件)`,
                        files: [file]
                    });
                    return;
                } catch(e) {
                    // キャンセル等の場合はダウンロードフォールバック
                }
            }

            // 通常ダウンロードフォールバック
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            link.click();
        }

        function clearLogs() {
            if (confirm("この端末に保存されたログをすべて消去しますか？\n（エクスポート済みであることを確認してください）")) {
                scanLogs = [];
                localStorage.removeItem(STORAGE_KEY);
                updateUI();
                alert("ログを消去しました。");
            }
        }

        updateUI();
    </script>
</body>
</html>
